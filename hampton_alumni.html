<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hampton University Alumni Network</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="hu-badge">HU</span>
        <div>
          <h1>Hampton Alumni Network</h1>
          <p>Hampton University &mdash; Est. 1868</p>
        </div>
      </div>
      <nav>
        <button class="nav-btn active" onclick="showView('map')">🗺 Alumni Map</button>
        <button class="nav-btn" onclick="showView('survey')">📋 Find Your Match</button>
      </nav>
    </div>
  </header>

  <!-- MAP VIEW -->
  <section id="view-map" class="view active">
    <div class="map-layout">

      <!-- Sidebar -->
      <aside class="sidebar">
        <h2>Alumni Directory</h2>
        <input type="text" id="search" placeholder="Search by name, major, city..." oninput="filterAlumni()" />

        <div class="filter-row">
          <select id="filter-major" onchange="filterAlumni()">
            <option value="">All Majors</option>
            <option>Computer Science</option>
            <option>Business Administration</option>
            <option>Communications</option>
            <option>Nursing</option>
            <option>Engineering</option>
            <option>Biology</option>
            <option>Political Science</option>
            <option>Architecture</option>
          </select>
          <select id="filter-year" onchange="filterAlumni()">
            <option value="">All Years</option>
            <option>2024</option>
            <option>2022</option>
            <option>2020</option>
            <option>2018</option>
            <option>2015</option>
            <option>2010</option>
            <option>2005</option>
          </select>
        </div>

        <div id="alumni-list"></div>
      </aside>

      <!-- Map -->
      <div id="map"></div>
    </div>
  </section>

  <!-- SURVEY VIEW -->
  <section id="view-survey" class="view">
    <div class="survey-container">
      <div class="survey-header">
        <h2>Match Me With an Alumni</h2>
        <p>Fill out this quick survey and we'll connect you with a Hampton alumni in your field of interest.</p>
      </div>

      <form id="survey-form" onsubmit="submitSurvey(event)">

        <div class="form-group">
          <label>Your Name</label>
          <input type="text" name="name" placeholder="First Last" required />
        </div>

        <div class="form-group">
          <label>Your Major</label>
          <select name="major" required>
            <option value="">Select...</option>
            <option>Computer Science</option>
            <option>Business Administration</option>
            <option>Communications</option>
            <option>Nursing</option>
            <option>Engineering</option>
            <option>Biology</option>
            <option>Political Science</option>
            <option>Architecture</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Career Interest</label>
          <select name="career" required>
            <option value="">Select...</option>
            <option>Technology</option>
            <option>Healthcare</option>
            <option>Finance & Banking</option>
            <option>Media & Entertainment</option>
            <option>Government & Policy</option>
            <option>Education</option>
            <option>Engineering & Architecture</option>
            <option>Entrepreneurship</option>
            <option>Non-Profit / Social Impact</option>
          </select>
        </div>

        <div class="form-group">
          <label>Preferred Location to Work</label>
          <select name="location" required>
            <option value="">Select...</option>
            <option>Northeast (NY, DC, MD, VA)</option>
            <option>Southeast (GA, FL, NC, SC)</option>
            <option>Midwest (IL, OH, MI, ND)</option>
            <option>Southwest (TX, AZ)</option>
            <option>West Coast (CA, WA, OR)</option>
            <option>Mountain West (CO, UT, MT)</option>
            <option>Open to Anywhere</option>
          </select>
        </div>

        <div class="form-group">
          <label>What are you looking for?</label>
          <div class="checkbox-group">
            <label><input type="checkbox" name="goal" value="mentorship" /> Mentorship</label>
            <label><input type="checkbox" name="goal" value="internship" /> Internship Leads</label>
            <label><input type="checkbox" name="goal" value="job" /> Job Opportunities</label>
            <label><input type="checkbox" name="goal" value="networking" /> Networking</label>
            <label><input type="checkbox" name="goal" value="advice" /> Career Advice</label>
          </div>
        </div>

        <div class="form-group">
          <label>Tell us about yourself (optional)</label>
          <textarea name="bio" rows="3" placeholder="Interests, goals, anything you'd like an alumni to know..."></textarea>
        </div>

        <button type="submit" class="submit-btn">Find My Match</button>
      </form>

      <!-- Match Result -->
      <div id="match-result" class="match-result hidden"></div>
    </div>
  </section>

  <!-- Connect Modal -->
  <div id="connect-modal" class="modal-overlay hidden" onclick="closeModal(event)">
    <div class="modal">
      <button class="modal-close" onclick="closeConnectModal()">✕</button>
      <div class="modal-header">
        <div id="modal-avatar" class="modal-avatar"></div>
        <div>
          <h3 id="modal-name"></h3>
          <p id="modal-role"></p>
        </div>
      </div>
      <form onsubmit="sendMessage(event)">
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="msg-sender" placeholder="First Last" required />
        </div>
        <div class="form-group">
          <label>Your Message</label>
          <textarea id="msg-body" rows="4" placeholder="Introduce yourself and let them know what you're hoping to learn..." required></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
